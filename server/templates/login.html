<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · VITAL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1220'/%3E%3Cpath d='M3 17h6l3-8 5 15 3-7h9' stroke='%232BE38A' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vital.css') }}">
  <script src="{{ url_for('static', filename='js/vital.js') }}"></script>
</head>
<body>
<div class="login-wrap">
  <form class="login panel" method="post">
    <div class="brand">
      <svg viewBox="0 0 64 36"><path d="M2 20h14l6-14 10 28 6-14h24" stroke="#2BE38A" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
      VITAL
    </div>
    <p class="sub">Vitals Intelligence, Tracking &amp; Anomaly Learning</p>
    <canvas class="monitor ecg" id="ecg"></canvas>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label class="f"><span>Username</span><input type="text" name="username" autocomplete="username" autofocus required></label>
    <label class="f"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Log in</button>
  </form>
</div>
<script>
  // decorative pulse trace
  const m = new Monitor(document.getElementById("ecg"), { seconds: 4, fs: 50, grid: 0 });
  let t = 0;
  setInterval(() => {
    const s = [];
    for (let i = 0; i < 10; i++, t += 1 / 50) {
      const f = (t * 72 / 60) % 1;
      s.push(Math.exp(-(((f - .18) / .07) ** 2)) + .38 * Math.exp(-(((f - .42) / .09) ** 2)));
    }
    m.push(s);
  }, 200);
  m.start();
</script>
</body>
</html>
